<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portofolio desain dan fotografi - Raheru_oi">
    <title>Portofolio - Rahel Nur Qolim Firdaus</title>

    <!-- Font Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3 (CSS) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"

    <!-- CSS kustom (dimuat setelah Bootstrap agar bisa menimpa variabelnya) -->
    <link rel="stylesheet" href="lou.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Tombol Ganti Tema (Light/Dark Mode) -->
    <button type="button" onclick="toggleTheme()" class="theme-toggle btn rounded-circle position-fixed top-0 end-0 m-3 m-md-4 d-flex align-items-center justify-content-center" title="Ganti Tema" aria-label="Ganti Tema">
        <!-- Ikon Matahari (tampil saat Dark Mode) -->
        <svg class="icon-sun" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
        </svg>
        <!-- Ikon Bulan (tampil saat Light Mode) -->
        <svg class="icon-moon" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
        </svg>
    </button>

    <!-- ================= LOADING SCREEN ================= -->
    <div id="loading-screen" role="status">
        <div class="spinner-border" aria-hidden="true"></div>
        <span class="loading-text">MEMUAT...</span>
    </div>
    <!-- ================= END LOADING SCREEN ================= -->

        <!-- SECTION ABOUT -->
        <section class="about fade-in-up pb-5">
            <div class="row align-items-center justify-content-center g-4 g-lg-5">

                <!-- FOTO PROFIL -->
                <div class="col-12 col-md-auto d-flex justify-content-center">
                    <div class="profile-container" onclick="toggleProfile()" title="Klik untuk ganti foto">
                        <!-- Ganti Src dengan nama file foto kamu -->
                        <img id="profileImg" src="profil/1.jpeg" alt="Foto Rahel">
                    </div>
                </div>

                <!-- TEKS ABOUT -->
                <div class="col-12 col-md text-center text-md-start">
                    <h1 class="name-text-effect display-5 mb-2">raheru</h1>

                    <p class="text-body-secondary mb-4">
                        <span class="fw-medium text-body">Nama instagram:</span>
                        <a href="https://www.instagram.com/raheru_oi/" target="_blank" rel="noopener noreferrer" class="ig-link link-body-emphasis link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover" title="Buka Instagram Raheru_oi">Raheru_oi</a>
                    </p>

                    <div class="about-note mx-auto mx-md-0">
                        <span class="about-note-label">alasan</span>
                        <p class="mb-0">
                            Semua hasil desain dan jepretan kamera terbaikku aku kumpulin di sini. Boleh banget diliat-liat dan boleh juga kok di dowload fotonya, semoga suka yaaaaaa.
                        </p>
                    </div>
                    
                </div>

            </div>
        </section>

    <footer class="border-top py-4 mt-auto text-center small text-body-secondary">
        <p class="mb-0">Portofolio Digital &copy; 2024 - Raheru_oi</p>

    <!-- ================= LIGHTBOX (FOTO FULL SCREEN) ================= -->
